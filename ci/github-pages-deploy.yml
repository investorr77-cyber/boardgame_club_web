# Автоматическая сборка и публикация на GitHub Pages при изменении ветки main (ПР6, п. 15).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Приложение публикуется в подкаталоге /boardgame_club_web/ — нужен --base-href.
      # Адрес API — параметр сборки, а не константа в коде.
      - run: >
          flutter build web --release
          --base-href /boardgame_club_web/
          --dart-define=API_BASE_URL=https://boardgame-club-api.onrender.com/api
      # GitHub Pages не перенаправляет неизвестные пути на index.html,
      # но отдаёт 404.html — копия index.html делает прямые ссылки рабочими.
      - run: cp build/web/index.html build/web/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
